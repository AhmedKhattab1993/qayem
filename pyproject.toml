[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qayem"
version = "0.1.0"
description = "Unified parser + database for Egyptian secondary-market (resale) property listings"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.12",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.115,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
qayem = "qayem.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qayem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
